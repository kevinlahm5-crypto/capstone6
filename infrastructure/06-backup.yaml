AWSTemplateFormatVersion: "2010-09-09"
Description: Capstone 6 - AWS Backup vault + daily backup plan for the RDS instance.

Parameters:
  EnvName:
    Type: String
    Default: capstone6

Resources:
  BackupVault:
    Type: AWS::Backup::BackupVault
    Properties:
      BackupVaultName: !Sub "${EnvName}-backup-vault"

  BackupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: backup.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores

  BackupPlan:
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: !Sub "${EnvName}-daily-backup"
        BackupPlanRule:
          - RuleName: DailySnapshots
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: "cron(0 5 * * ? *)" # daily 05:00 UTC
            StartWindowMinutes: 60
            CompletionWindowMinutes: 180
            Lifecycle:
              DeleteAfterDays: 14

  BackupSelection:
    Type: AWS::Backup::BackupSelection
    Properties:
      BackupPlanId: !Ref BackupPlan
      BackupSelection:
        SelectionName: !Sub "${EnvName}-rds-selection"
        IamRoleArn: !GetAtt BackupRole.Arn
        Resources:
          - Fn::Sub:
              - "arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:${DbId}"
              - DbId: !Sub "${EnvName}-db"

Outputs:
  BackupVaultName:
    Value: !Ref BackupVault
  BackupPlanId:
    Value: !Ref BackupPlan
